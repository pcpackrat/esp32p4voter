; ESP32-P4 Voter - full duplex (RX + TX) voter client
; Hardware: Waveshare ESP32-P4-WIFI6-POE-ETH (ESP32-P4 + IP101 Ethernet +
; ESP32-C6 WiFi + onboard ES8311 codec) + GPS w/ PPS
;
; Board: esp32-p4 = chip revision < 3.0 (ES). If esptool reports a v3.x
; chip at first flash, change to esp32-p4_r3.

[env:esp32-p4]
platform = espressif32
board = esp32-p4
framework = arduino
monitor_speed = 115200
extra_scripts = pre:build_timestamp.py

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -D CORE_DEBUG_LEVEL=0
